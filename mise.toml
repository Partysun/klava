[tools]
rust = "stable"

[tasks.test-watch]
description = "Auto-run tests when files change"
run = "cargo watch -x test"
sources = [
    "src/**/*.rs",
    "tests/**/*.rs"
]

[tasks.test-hurl]
description = "Run hurl integration tests against localhost:8085"
run = "hurl --variable host=http://localhost:8085 --test tests.hurl"

[tasks.build-pypi-artifacts]
description = "Build artifacts for PyPI (manylinux via Docker + native via uv)"
run = "docker run --rm -v $(pwd):/io ghcr.io/pyo3/maturin build --release --manylinux 2_17 --out dist && uv run maturin build --release --out dist"
