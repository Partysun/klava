[tools]
rust = "stable"
jj = "0.45.1"

[tasks.test-watch]
description = "Auto-run tests when files change"
run = "cargo watch -x test"
sources = ["src/**/*.rs", "tests/**/*.rs"]

[tasks.test-hurl]
description = "Run hurl integration tests against localhost:8085"
run = "hurl --variable host=http://localhost:8085 --test tests.hurl"

[tasks.build-native]
description = "Build for current platform"
run = "cargo build --release"

[tasks.check-version]
description = "Verify Cargo.toml / pyproject.toml / npm/package.json versions agree"
run = "bash scripts/check-version.sh"

[tasks.check-published]
description = "Check that the current version is live on crates.io, PyPI and npm"
run = "bash scripts/check-published.sh"

[tasks.build-wheel-linux]
description = "Build the manylinux x86_64 wheel + sdist locally (CI also builds an arm64 wheel with zig)"
run = "docker run --rm -v $(pwd):/io ghcr.io/pyo3/maturin maturin build --release --locked --manylinux 2_17 --sdist --out dist"

[tasks.pack-npm]
description = "Dry-run the npm tarballs (platform binaries must already be in npm/platforms/*/)"
run = "node scripts/npm-version.js npm npm/platforms/*/ && npm pack --dry-run --json ./npm"
