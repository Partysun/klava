[package]
name = "klava-compress"
# Versioned on its own, not from [workspace.package]: this crate ships fixes that
# the other two extensions do not have, and crates.io cannot republish a version.
# 0.1.6 fixes four defects in 0.1.5 (empty rewrites, budget_ms overrunning the
# host timeout, per-message memory summing, per-message log lines).
version = "0.1.6"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Context compression extension for klava: drop low-value tokens from tool output with kompress."
readme = "README.md"

[[bin]]
name = "klava-compress"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
ort = { version = "=2.0.0-rc.10", default-features = false, features = [
  "ndarray",
  "download-binaries",
  "std",
] }
# `--fetch-model`. Already in the build graph through ort-sys; declaring it here
# makes the model download a runtime feature instead of a shell script.
#
# No `gzip`: with it ureq advertises gzip, and `content-length` then describes the
# compressed body while the file we keep is decompressed. Resume (Range) and the
# size check both need raw bytes, so compression must stay off.
ureq = { version = "3", default-features = false, features = ["rustls"] }

# Memory detection outside Linux. Each is a handful of constants and one syscall
# already exposed by the OS; a full `sysinfo`-style crate would pull in process
# enumeration this extension has no use for. Both are target-gated so a Linux
# build does not carry them.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[dev-dependencies]
# The manifest test parses `--print-manifest` output the way klava will.
toml = "1"
