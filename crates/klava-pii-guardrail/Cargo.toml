[package]
name = "klava-pii-guardrail"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "PII guardrail extension for klava: span-based detection and redaction in tool output."
readme = "README.md"

[[bin]]
name = "klava-pii-guardrail"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
pii = "0.1.0"

[dev-dependencies]
# The manifest tests parse `--print-manifest` output the way klava will.
toml = "1"
