[package]
name = "klava-pii-guardrail"
# Versioned on its own, not from [workspace.package]: crates.io cannot
# republish a version, and a guardrail fix must not force a bump on the other
# extensions. 0.1.6 fixes the quadratic redaction that timed out on large tool
# output, and refuses payloads too large to analyze.
version = "0.1.6"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "PII guardrail extension for klava: span-based detection and redaction in tool output."
readme = "README.md"

[[bin]]
name = "klava-pii-guardrail"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
pii = "0.1.0"
# Same versions `pii` uses, so `hash:<salt>` output stays byte-identical while
# the operators are applied here instead of in `Anonymizer::anonymize`.
hex = "0.4"
sha2 = "0.10"

[dev-dependencies]
# The manifest tests parse `--print-manifest` output the way klava will.
toml = "1"
