# PyPI + npm release for macOS (single darwin/amd64 agent).
#
# Publishes:
#   - one universal2 wheel (Intel x64 + Apple Silicon arm64 slices lipo-merged
#     by maturin, so an Intel agent covers both)
#   - the npm package `@zatsepin/klava-darwin` with the same fat binary
#   - the extension crates as prebuilt universal2 npm packages:
#     `@zatsepin/klava-<ext>-darwin`
#
# All logic lives in scripts/ so Woodpecker's envsubst never touches a dollar
# sign; klava has no ONNX runtime in the CLI, so unlike jigor both slices are
# plain cargo builds.
when:
  - event: deployment
    evaluate: '(CI_PIPELINE_DEPLOY_TASK ?? "") in ["", "macos", "npm", "pypi", "publish"]'
  - event: tag
    ref: refs/tags/v*

labels:
  platform: darwin/amd64

steps:
  - name: build
    image: bash
    commands:
      - bash scripts/release-macos.sh build

  - name: publish-pypi
    image: bash
    depends_on:
      - build
    environment:
      UV_PUBLISH_TOKEN:
        from_secret: uv_token
    commands:
      - bash scripts/release-macos.sh pypi

  - name: publish-npm
    image: bash
    depends_on:
      - build
    environment:
      NPM_TOKEN:
        from_secret: npm_token
    commands:
      - bash scripts/release-macos.sh npm

  # Extensions are versioned and published independently of the CLI: these
  # steps never gate (or are gated by) the CLI's build/publish above.
  - name: build-extensions
    image: bash
    commands:
      - bash scripts/release-macos.sh extensions-build

  - name: publish-npm-extensions
    image: bash
    depends_on:
      - build-extensions
    environment:
      NPM_TOKEN:
        from_secret: npm_token
    commands:
      - bash scripts/release-macos.sh extensions
