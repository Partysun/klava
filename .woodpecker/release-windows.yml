# PyPI + npm release for Windows (native powershell on the local agent).
#
# Publishes:
#   - the PyPI win_amd64 wheel
#   - the npm package `@zatsepin/klava-win32-x64-msvc`
#   - the extension crates as prebuilt npm packages:
#     `@zatsepin/klava-<ext>-win32-x64-msvc`
#
# Step environments DO reach powershell steps, but not the bash (WSL) steps,
# so everything runs in powershell via a script file — which also keeps
# Woodpecker's envsubst away from `$` signs.
when:
  - event: deployment
    evaluate: '(CI_PIPELINE_DEPLOY_TASK ?? "") in ["", "windows", "npm", "pypi", "publish"]'
  - event: tag
    ref: refs/tags/v*

labels:
  platform: windows/amd64

steps:
  - name: build
    image: powershell
    # plain `powershell` blocks .ps1 scripts (execution policy); run a
    # nested shell with a bypass
    commands:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts\release-windows.ps1 build

  - name: publish-pypi
    image: powershell
    depends_on:
      - build
    environment:
      UV_PUBLISH_TOKEN:
        from_secret: uv_token
    commands:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts\release-windows.ps1 pypi

  - name: publish-npm
    image: powershell
    depends_on:
      - build
    environment:
      NPM_TOKEN:
        from_secret: npm_token
    commands:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts\release-windows.ps1 npm

  # Extensions are versioned and published independently of the CLI: these
  # steps never gate (or are gated by) the CLI's build/publish above.
  - name: build-extensions
    image: powershell
    commands:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts\release-windows.ps1 extensions-build

  - name: publish-npm-extensions
    image: powershell
    depends_on:
      - build-extensions
    environment:
      NPM_TOKEN:
        from_secret: npm_token
    commands:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts\release-windows.ps1 extensions
