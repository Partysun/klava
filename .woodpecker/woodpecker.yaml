when:
  - event: [push, pull_request]
    branch: master
  - event: manual

labels:
  backend: docker
  platform: linux/amd64

steps:
  - name: test
    image: rust:latest
    commands:
      - cargo test
      # fails when Cargo.toml / pyproject.toml / npm/package.json drift apart:
      # each registry is published from its own manifest
      - bash scripts/check-version.sh

  - name: build
    image: ghcr.io/pyo3/maturin
    commands:
      - maturin build --release --locked --manylinux 2_17 --sdist --out dist
    depends_on:
      - test
