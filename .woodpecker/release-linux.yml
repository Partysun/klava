# PyPI + npm release for linux/amd64.
#
# Publishes, from the one amd64 docker agent:
#   - the PyPI x86_64 wheel, aarch64 wheel (cross-compiled with zig) and sdist
#   - the npm platform packages `@zatsepin/klava-linux-{x64,arm64}-gnu`
#     plus the meta `@zatsepin/klava` package
#
# Steps are split by phase and cut across two images (the maturin image has
# the manylinux toolchain but no node; node:22 has npm), and all logic lives
# in scripts/ so Woodpecker's envsubst never touches a dollar sign.
when:
  - event: deployment
    evaluate: '(CI_PIPELINE_DEPLOY_TASK ?? "") in ["", "linux", "npm", "pypi", "publish"]'
  - event: tag
    ref: refs/tags/v*

labels:
  backend: docker
  platform: linux/amd64

steps:
  - name: build
    image: ghcr.io/pyo3/maturin
    commands:
      - bash scripts/release-linux.sh build

  # publishing is idempotent per registry: a failed npm push never blocks
  # PyPI and a re-run of the same tag is a no-op on both
  - name: publish-pypi
    image: ghcr.io/pyo3/maturin
    depends_on:
      - build
    environment:
      UV_PUBLISH_TOKEN:
        from_secret: uv_token
    commands:
      - bash scripts/release-linux.sh pypi

  - name: publish-npm
    image: node:22
    depends_on:
      - build
    environment:
      NPM_TOKEN:
        from_secret: npm_token
    commands:
      - bash scripts/release-linux.sh npm
