[package]
name = "klava"
version = "0.1.0"
edition = "2024"
authors = ["Iurii Zatsepin (https://zatsepin.dev)"]
description = "AI proxy server for routing and transforming LLM requests"
license = "Apache v. 2.0"
repository = "https://github.com/Partysun/klava"

[lib]
name = "klava"
path = "src/lib.rs"

[[bin]]
name = "klava"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "signal", "process"] }

# Web framework
axum = { version = "0.8.8", features = ["http2"] }

# HTTP client
reqwest = { version = "0.13.2", features = ["json", "stream", "rustls"], default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async utilities
futures = "0.3"
tokio-stream = "0.1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0.0"
similar = "2.7.0"

# Daemonize (Unix only)
[target.'cfg(unix)'.dependencies]
daemonize = "0.5"

# Server utilities
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }

# Async streams
async-stream = "0.3"
bytes = "1.9"
pin-project = "1.1"

confy = "2.0.0"
which = "8.0.2"
chrono = "0.4"

inquire = { version = "0.9.4", default-features = false, features = ["console", "macros"] }
pii = "0.1.0"
tokenx-rs = "0.1.0"

# Optional feature: OpenCode Agent support
[features]
default = []
opencode = []
telemetry = []

[profile.release]
opt-level = "z"        # Optimize for size
lto = true             # Enable Link Time Optimization
codegen-units = 1      # Better optimization
strip = true           # Strip symbols for smaller binary
panic = "abort"        # Smaller binary
