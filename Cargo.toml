[package]
name = "klava"
version = "0.2.1"
edition = "2024"
authors = ["Iurii Zatsepin (https://zatsepin.dev)"]
description = "Klava is a CLI tool for using code agents with any provider. Use Claude Code with your OpenAI-compatible provider. Make code agents more secure by filtering out leaked secret keys and cryptographic keys from your filesystem."
categories = ["command-line-utilities", "development-tools"]
license = "Apache-2.0"
repository = "https://github.com/Partysun/klava"

[lib]
name = "klava"
path = "src/lib.rs"

[[bin]]
name = "klava"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "signal", "process"] }

# Web framework
axum = { version = "0.8.8", features = ["http2"] }

# HTTP client
reqwest = { version = "0.13.2", features = ["json", "stream", "rustls", "form"], default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = { version = "1.1.2", features = ["serde"] }
uuid = { version = "1.23.0", features = ["v4"] }

# Async utilities
futures = "0.3"
tokio-stream = "0.1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0.0"
similar = "3.0.0"
colored = "3.1.1"
genai = "0.5.3"

# Daemonize (Unix only)
[target.'cfg(unix)'.dependencies]
daemonize = "0.5"

# Server utilities
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }

# Async streams
async-stream = "0.3"
bytes = "1.9"
pin-project = "1.1"

confy = "2.0.0"
which = "8.0.2"
chrono = { version = "0.4", features = ["serde"] }

inquire = { version = "0.9.4", default-features = false, features = ["console", "macros"] }
pii = "0.1.0"
tokenx-rs = "0.1.0"

# Optional dependencies for qwen-free feature
sha2 = { version = "0.11", optional = true }
base64 = { version = "0.22", optional = true }
rand = { version = "0.10", optional = true }

# Optional feature flags
[features]
default = ["qwen-free", "opencode", "codex"]
opencode = []
codex = []
telemetry = []
qwen-free = ["dep:sha2", "dep:base64", "dep:rand"]

# Examples using qwen-free feature
[[example]]
name = "qwen_auth_flow"
required-features = ["qwen-free"]

[[example]]
name = "qwen_request_test"
required-features = ["qwen-free"]

[profile.release]
opt-level = "z"        # Optimize for size
lto = true             # Enable Link Time Optimization
codegen-units = 1      # Better optimization
strip = true           # Strip symbols for smaller binary
panic = "abort"        # Smaller binary
